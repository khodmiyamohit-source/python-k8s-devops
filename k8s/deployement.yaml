apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-k8s-devops
spec:
  replicas: 2

  selector:
    matchLabels:
      app: python-k8s-devops

  template:
    metadata:
      labels:
        app: python-k8s-devops

    spec:
      containers:
        - name: python-k8s-devops
          image: mohitdevops74/python-k8s-devops:latest
          ports:
            - containerPort: 5000